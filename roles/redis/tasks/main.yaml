---
- name: Ensure packages are up to date
  package:
    update_cache: yes

- name: Install Epel for EL7
  package:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm
    state: present
  when:
    (ansible_distribution == "RedHat" or ansible_distribution == "CentOS") and ansible_distribution_major_version == "7" or
    ansible_distribution == "Amazon" and ansible_distribution_major_version == "2"

- name: Install Epel for EL8
  package:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
    state: present
  when:
    (ansible_distribution == "RedHat" or ansible_distribution == "CentOS") and ansible_distribution_major_version == "8"

- name: Install Epel for EL9
  package:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
    state: present
  when:
    (ansible_distribution == "RedHat" or ansible_distribution == "CentOS") and ansible_distribution_major_version == "9"
